---
- name: Prepare build directory and known_hosts
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Ensure build directories exist
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../build/answers"
        state: directory
        mode: "0700"

    - name: Render known_hosts for all Proxmox hosts
      ansible.builtin.template:
        src: known_hosts.j2
        dest: "{{ playbook_dir }}/../known_hosts"
        mode: "0644"

- name: Render Proxmox answer files and build ISOs
  hosts: proxmox
  connection: local
  gather_facts: false
  vars:
    build_dir: "{{ playbook_dir }}/../../build"
    answer_file: "{{ build_dir }}/answers/{{ inventory_hostname }}.toml"
    firstboot_file: "{{ build_dir }}/answers/{{ inventory_hostname }}-first-boot.sh"
    iso_file: "{{ build_dir }}/{{ inventory_hostname }}.iso"
    sum_file: "{{ iso_file }}.inputs.sha256"
  tasks:
    - name: Render, build and clean up
      delegate_to: localhost
      block:
        - name: Render answer file
          ansible.builtin.template:
            src: answer.toml.j2
            dest: "{{ answer_file }}"
            mode: "0600"
          changed_when: false

        - name: Render first-boot script
          ansible.builtin.template:
            src: first-boot.sh.j2
            dest: "{{ firstboot_file }}"
            mode: "0700"
          changed_when: false

        - name: Validate answer file
          ansible.builtin.command:
            argv:
              - proxmox-auto-install-assistant
              - validate-answer
              - "{{ answer_file }}"
          register: validate
          changed_when: false
          failed_when: validate.rc != 0 or 'no errors found' not in validate.stdout

        - name: Checksum answer file
          ansible.builtin.stat:
            path: "{{ answer_file }}"
            checksum_algorithm: sha256
          register: answer

        - name: Checksum first-boot script
          ansible.builtin.stat:
            path: "{{ firstboot_file }}"
            checksum_algorithm: sha256
          register: firstboot

        - name: Combine checksums
          ansible.builtin.set_fact:
            inputs_sum: "{{ (answer.stat.checksum ~ firstboot.stat.checksum) | hash('sha256') }}"

        - name: Check if ISO already exists
          ansible.builtin.stat:
            path: "{{ iso_file }}"
          register: iso

        - name: Build ISO
          ansible.builtin.command:
            argv:
              - proxmox-auto-install-assistant
              - prepare-iso
              - "{{ build_dir }}/proxmox-ve.iso"
              - --fetch-from
              - iso
              - --answer-file
              - "{{ answer_file }}"
              - --on-first-boot
              - "{{ firstboot_file }}"
              - --output
              - "{{ iso_file }}"
          when: >-
            not iso.stat.exists or
            inputs_sum != lookup('ansible.builtin.file', sum_file, errors='ignore') | default('', true)
          changed_when: true
          throttle: 1

        - name: Remember which inputs the ISO was built from
          ansible.builtin.copy:
            content: "{{ inputs_sum }}"
            dest: "{{ sum_file }}"
            mode: "0600"
      always:
        - name: Remove rendered secrets
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ answer_file }}"
            - "{{ firstboot_file }}"
          changed_when: false
