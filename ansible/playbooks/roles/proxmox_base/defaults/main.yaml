---
# Proxmox no-subscription repository
proxmox_base_pve_repo_url: http://download.proxmox.com/debian/pve
proxmox_base_pve_repo_component: pve-no-subscription
# PVE 9 location
proxmox_base_pve_repo_keyring: /usr/share/keyrings/proxmox-archive-keyring.gpg
# PVE 8 location
# proxmox_base_pve_repo_keyring: /etc/apt/trusted.gpg.d/proxmox-release-bookworm.gpg
proxmox_base_pve_base_packages:
  - vim
  - htop
  - tmux
  - curl
  - iotop
  - lm-sensors
  - needrestart

proxmox_base_pve_allow_reboot: true
