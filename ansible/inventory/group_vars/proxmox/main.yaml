---
ansible_user: root
ansible_host: "{{ pve_ip.split('/')[0] }}"

pve_gateway: 192.168.0.1
pve_dns: 1.1.1.1

pve_timezone: Europe/Brussels
pve_keyboard: en-us
pve_country: be

pve_filesystem: zfs
pve_zfs_raid: raid0

ansible_ssh_common_args: >-
  -o UserKnownHostsFile={{ inventory_dir }}/../known_hosts
  -o StrictHostKeyChecking=yes
ansible_python_interpreter: /usr/bin/python3
